name: Inventory Full Audit (prod)

# Deep prod recon of Inventory Daily totals, export, example SKUs, history async.
# Uses localhost backend + /root/app/.env credentials on self-hosted runner.
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - name: Checkout audit script (clean workspace)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Full inventory audit against live prod
        run: |
          set -eu
          set -a
          # shellcheck disable=SC1091
          . /root/app/.env
          set +a
          export AUDIT_BASE="${AUDIT_BASE:-http://127.0.0.1:8000}"
          python3 backend/scripts/inventory_prod_full_audit.py
