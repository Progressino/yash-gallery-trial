name: Path capture

on:
  workflow_dispatch:
    inputs:
      client_ip:
        description: 'Client IP to watch (Airtel etc)'
        required: true
        default: '106.219.122.254'

jobs:
  capture:
    runs-on: self-hosted
    steps:
      - name: Capture SYNs while client curls
        run: |
          set +e
          CIP="${{ github.event.inputs.client_ip }}"
          echo "watching client_ip=$CIP for 25s — curl from that network NOW"
          timeout 25 tcpdump -ni eth0 "host $CIP and tcp port 80 or tcp port 443 or tcp port 22" -c 50 -tttt 2>&1 | tee /tmp/pcap.txt
          echo '── capture summary ──'
          wc -l /tmp/pcap.txt
          cat /tmp/pcap.txt
          echo PATH_CAPTURE_DONE
