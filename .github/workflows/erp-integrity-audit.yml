name: ERP integrity audit

# Production warm-cache integrity audit (self-hosted runner → docker backend).
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Run ERP integrity audit in backend container
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'progressino-backend|backend' | head -1 || true)"
          if [ -z "${CID}" ]; then
            echo "FATAL: no backend container"
            docker ps || true
            exit 1
          fi
          echo "Container: ${CID}"
          # Always refresh script from latest origin/main (container path may be stale).
          if [ -d /root/app/.git ]; then
            git -C /root/app fetch origin main 2>/dev/null || true
            git -C /root/app show origin/main:backend/scripts/erp_integrity_audit.py \
              > /tmp/erp_integrity_audit.py
          elif [ -f /root/app/backend/scripts/erp_integrity_audit.py ]; then
            cp /root/app/backend/scripts/erp_integrity_audit.py /tmp/erp_integrity_audit.py
          else
            echo "FATAL: erp_integrity_audit.py not found on host"
            exit 1
          fi
          docker cp /tmp/erp_integrity_audit.py "${CID}:/srv/backend/scripts/erp_integrity_audit.py" \
            || docker cp /tmp/erp_integrity_audit.py "${CID}:/app/backend/scripts/erp_integrity_audit.py"
          docker exec -e PYTHONPATH=/srv -e WARM_CACHE_DIR=/data/warm_cache -w /srv \
            "${CID}" python -m backend.scripts.erp_integrity_audit \
            > /tmp/erp_integrity_audit.json 2>/tmp/erp_integrity_audit.err || RC=$?
          echo "exit_code=${RC:-0}"
          echo "=== STDERR ==="
          cat /tmp/erp_integrity_audit.err || true
          echo "=== SUMMARY ==="
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          p = Path("/tmp/erp_integrity_audit.json")
          if not p.is_file() or p.stat().st_size < 10:
              print("NO_JSON")
              sys.exit(1)
          d = json.loads(p.read_text())
          s = d.get("summary") or {}
          print(json.dumps({"ok": d.get("ok"), "summary": s, "fatal": d.get("fatal")}, indent=2))
          fails = [c for c in d.get("checks") or [] if not c.get("ok") and c.get("severity") == "fail"]
          warns = [c for c in d.get("checks") or [] if not c.get("ok") and c.get("severity") == "warn"]
          print(f"FAILS ({len(fails)}):")
          for c in fails[:50]:
              print(f"  [{c.get('area')}] {c.get('id')}: {c.get('title')} — {(c.get('detail') or '')[:220]}")
          print(f"WARNS ({len(warns)}):")
          for c in warns[:30]:
              print(f"  [{c.get('area')}] {c.get('id')}: {c.get('title')} — {(c.get('detail') or '')[:180]}")
          # Write compact report for artifact step
          Path("/tmp/erp_integrity_summary.json").write_text(json.dumps({
              "ok": d.get("ok"),
              "summary": s,
              "fails": fails,
              "warns": warns[:40],
              "root_causes": d.get("root_causes") or [],
          }, default=str, indent=2))
          sys.exit(0 if d.get("ok") else 2)
          PY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erp-integrity-audit
          path: |
            /tmp/erp_integrity_audit.json
            /tmp/erp_integrity_summary.json
            /tmp/erp_integrity_audit.err
          if-no-files-found: warn
