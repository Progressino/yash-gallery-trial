name: Probe HRM responsibility edit (prod)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to VPS"]
    types: [completed]
    branches: [main]

jobs:
  hrm-edit-probe:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Wait for backend after deploy
        if: github.event_name == 'workflow_run'
        run: sleep 90

      - name: Checkout probe
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify edit fields persist on prod
        run: |
          set -eu
          cd /root/app
          set -a
          # shellcheck disable=SC1091
          . ./.env
          set +a
          python3 "${GITHUB_WORKSPACE}/backend/scripts/probe_hrm_edit_prod.py"
