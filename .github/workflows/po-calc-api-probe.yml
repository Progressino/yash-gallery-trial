name: PO calculate API probe

# Login as admin and run the same POST /api/po/calculate flow the UI uses.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'use_shared_cache=0 force recalculate'
        default: '0'

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Login and Calculate PO like UI
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          . /root/app/.env
          set +a
          FORCE_IN="${{ github.event.inputs.force }}"
          export FORCE_IN
          python3 <<'PY'
          import os, time, json, requests

          base = "http://127.0.0.1:8000"
          s = requests.Session()
          r = s.post(
              f"{base}/api/auth/login",
              json={"username": os.environ["AUTH_USERNAME"], "password": os.environ["AUTH_PASSWORD"]},
              headers={"X-Device-Id": "gha-po-calc-probe"},
              timeout=60,
          )
          print("login", r.status_code, (r.text or "")[:200])
          r.raise_for_status()
          h = s.get(f"{base}/api/health", timeout=30)
          print("health", h.status_code, h.text[:400])

          # Soft-404 regression: unknown job id must not hard-404.
          miss = s.get(f"{base}/api/po/calculate/status/deadbeefcaf0", timeout=30)
          print("missing_job_status", miss.status_code, (miss.text or "")[:300])
          if miss.status_code == 404:
              raise SystemExit("missing job still returns 404 — soft-fallback broken")
          miss.raise_for_status()
          if not miss.json().get("job_missing"):
              print("WARN: job_missing flag absent; body=", miss.json())

          # Attach warm cache to this session so calculate can use shared data.
          hy = s.post(f"{base}/api/cache/hydrate-warm", timeout=600)
          print("hydrate", hy.status_code, (hy.text or "")[:300])
          hy.raise_for_status()

          body = {
              "period_days": 30,
              "lead_time": 60,
              "target_days": 180,
              "grace_days": 0,
              "demand_basis": "Sold",
              "group_by_parent": False,
              "safety_pct": 0.0,
              "use_seasonality": True,
              "use_ly_fallback": True,
              "use_oms_inventory_only": False,
              "inventory_history_channel": "oms",
              "seasonal_weight": 0.5,
              "enforce_two_size_minimum": True,
              "enforce_lead_time_release_gate": True,
              "urgent_all_sizes_days": 45,
              "planning_date": time.strftime("%Y-%m-%d"),
              "raise_ledger_lookback_days": 14,
              "raise_view_date": time.strftime("%Y-%m-%d"),
              "auto_import_yesterday_ledger": True,
              "use_shared_cache": True,
          }
          force = (os.environ.get("FORCE_IN") or "0").strip()
          if force in ("1", "true", "True"):
              body["use_shared_cache"] = False
          print("POST body", json.dumps(body))
          t0 = time.time()
          post = s.post(f"{base}/api/po/calculate", json=body, timeout=120)
          print("POST", post.status_code, post.headers.get("content-type"), (post.text or "")[:500])
          post.raise_for_status()
          data = post.json()
          job_id = data.get("job_id")
          print("job_id", job_id, "from_shared", data.get("from_shared_cache"))

          last = {}
          for i in range(400):  # ~20–40 min with backoff
              path = f"/api/po/calculate/status/{job_id}" if job_id else "/api/po/calculate/status"
              st = s.get(f"{base}{path}", timeout=45)
              print(f"poll{i} {path} -> {st.status_code} {(st.text or '')[:240]}")
              if st.status_code == 404:
                  print("FATAL_404", path, st.text)
                  raise SystemExit(2)
              st.raise_for_status()
              last = st.json()
              status = last.get("status")
              if status == "done":
                  res = s.get(
                      f"{base}/api/po/calculate/result" + (f"/{job_id}" if job_id else ""),
                      params={"offset": 0, "limit": 5, "compact": 1},
                      timeout=90,
                  )
                  print("result", res.status_code, (res.text or "")[:400])
                  if res.status_code == 404:
                      raise SystemExit(3)
                  res.raise_for_status()
                  rj = res.json()
                  if not rj.get("ok"):
                      print("RESULT_NOT_OK", rj)
                      raise SystemExit(6)
                  print(
                      "RESULT_OK total",
                      rj.get("total"),
                      "cols",
                      len(rj.get("columns") or []),
                      "elapsed",
                      round(time.time() - t0, 1),
                  )
                  raise SystemExit(0)
              if status == "error":
                  print("CALC_ERROR", last)
                  raise SystemExit(4)
              # Shared-cache hits finish in seconds; full calc needs longer sleeps.
              time.sleep(3 if i < 40 else 5)
          print("TIMEOUT last=", last)
          raise SystemExit(5)
          PY
