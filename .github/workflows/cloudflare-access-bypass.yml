name: Cloudflare access bypass

# ISP path to the VPS public IP is blackholed for Airtel (0 SYNs on eth0).
# Host UFW already allows 80/443 — opening more firewall rules does NOT fix this.
# Cloudflare Tunnel makes the VPS dial OUT; users reach Cloudflare edges instead.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'quick (trycloudflare.com) or named (CLOUDFLARE_TUNNEL_TOKEN secret)'
        required: true
        default: 'quick'
        type: choice
        options:
          - quick
          - named
          - status
          - stop-quick

jobs:
  tunnel:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /root/app
    steps:
      - name: Local health + firewall reality check
        run: |
          set -eu
          echo '── local health ──'
          curl -sf --max-time 8 http://127.0.0.1:8000/api/health | tee /tmp/local_health.json
          echo
          curl -skI --max-time 8 -H 'Host: app.progressino.com' https://127.0.0.1/ | head -12
          echo '── listening ──'
          ss -ltnp | grep -E ':80|:443|:8000' || true
          echo '── ufw ──'
          ufw status verbose || true
          echo 'NOTE: Airtel packets never reach eth0 — host firewall cannot unblock ISP blackholes.'

      - name: Install cloudflared
        if: ${{ github.event.inputs.mode != 'status' && github.event.inputs.mode != 'stop-quick' }}
        run: |
          set -eu
          if command -v cloudflared >/dev/null 2>&1; then
            cloudflared --version
            exit 0
          fi
          curl -fsSL -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Show tunnel status
        if: ${{ github.event.inputs.mode == 'status' }}
        run: |
          set +e
          systemctl --no-pager -l status progressino-cf-quick.service
          systemctl --no-pager -l status cloudflared.service
          echo '── saved quick URL ──'
          cat /root/app/CF_QUICK_TUNNEL_URL.txt 2>/dev/null || echo '(none)'
          echo '── recent quick log URL ──'
          grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /var/log/progressino-cf-quick.log 2>/dev/null | tail -3
          tail -30 /var/log/progressino-cf-quick.log 2>/dev/null || true

      - name: Stop quick tunnel
        if: ${{ github.event.inputs.mode == 'stop-quick' }}
        run: |
          set +e
          systemctl disable --now progressino-cf-quick.service
          rm -f /root/app/CF_QUICK_TUNNEL_URL.txt
          echo QUICK_TUNNEL_STOPPED

      - name: Start named tunnel
        if: ${{ github.event.inputs.mode == 'named' }}
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          set -eu
          if [ -z "${CLOUDFLARE_TUNNEL_TOKEN:-}" ]; then
            echo 'Missing repo secret CLOUDFLARE_TUNNEL_TOKEN'
            echo 'Create tunnel in Cloudflare Zero Trust → copy install token →'
            echo '  gh secret set CLOUDFLARE_TUNNEL_TOKEN'
            exit 1
          fi
          systemctl disable --now progressino-cf-quick.service 2>/dev/null || true
          systemctl stop cloudflared 2>/dev/null || true
          cloudflared service install "$CLOUDFLARE_TUNNEL_TOKEN" || true
          systemctl enable --now cloudflared
          systemctl restart cloudflared
          sleep 3
          systemctl --no-pager -l status cloudflared || true
          journalctl -u cloudflared -n 50 --no-pager || true
          echo NAMED_TUNNEL_STARTED

      - name: Start persistent quick tunnel
        if: ${{ github.event.inputs.mode == 'quick' }}
        run: |
          set -eu
          # Origin must be HTTPS vhost (HTTP :80 with Host app.* only 308-redirects).
          install -d /var/log /etc/systemd/system /usr/local/bin

          cat >/usr/local/bin/progressino-cf-quick-tunnel.sh <<'EOS'
          #!/bin/bash
          set -eu
          exec /usr/bin/cloudflared tunnel --no-autoupdate \
            --url https://127.0.0.1:443 \
            --no-tls-verify \
            --http-host-header app.progressino.com \
            --origin-server-name app.progressino.com \
            --logfile /var/log/progressino-cf-quick.log \
            --loglevel info
          EOS
          chmod +x /usr/local/bin/progressino-cf-quick-tunnel.sh

          cat >/etc/systemd/system/progressino-cf-quick.service <<'EOF'
          [Unit]
          Description=Progressino Cloudflare quick tunnel (ISP bypass)
          After=network-online.target docker.service
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/progressino-cf-quick-tunnel.sh
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable progressino-cf-quick.service
          : >/var/log/progressino-cf-quick.log
          systemctl restart progressino-cf-quick.service
          sleep 2
          systemctl --no-pager -l status progressino-cf-quick.service || true

          URL=""
          for _ in $(seq 1 60); do
            sleep 1
            URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /var/log/progressino-cf-quick.log 2>/dev/null | tail -1 || true)
            if [ -z "$URL" ]; then
              URL=$(journalctl -u progressino-cf-quick -n 80 --no-pager 2>/dev/null \
                | grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' | tail -1 || true)
            fi
            [ -n "$URL" ] && break
          done
          if [ -z "$URL" ]; then
            echo 'Failed to obtain trycloudflare.com URL'
            tail -120 /var/log/progressino-cf-quick.log || true
            journalctl -u progressino-cf-quick -n 80 --no-pager || true
            exit 1
          fi
          echo "$URL" | tee /root/app/CF_QUICK_TUNNEL_URL.txt
          echo "QUICK_TUNNEL_URL=$URL"

          CODE=000
          for _ in $(seq 1 12); do
            CODE=$(curl -sk -o /tmp/cf_health.json -w '%{http_code}' --connect-timeout 20 --max-time 45 \
              "$URL/api/health" || true)
            echo "cf_health_try code=$CODE"
            [ "$CODE" = "200" ] && break
            sleep 3
          done
          echo "cf_health_code=$CODE"
          head -c 400 /tmp/cf_health.json 2>/dev/null; echo
          if [ "$CODE" != "200" ]; then
            echo CF_HEALTH_FAIL_BUT_TUNNEL_LEFT_RUNNING
            echo "Try login anyway: $URL/"
            tail -80 /var/log/progressino-cf-quick.log || true
            # Do not tear down — origin may still work from client networks via CF edge.
            exit 1
          fi
          curl -skI --connect-timeout 15 --max-time 25 "$URL/" | head -15 || true
          echo CF_QUICK_TUNNEL_OK
          echo "LOGIN_URL=$URL/"
          echo "Stop with workflow mode=stop-quick or: systemctl disable --now progressino-cf-quick"
