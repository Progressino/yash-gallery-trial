name: Probe WIP feeder (Kaj/Handwork/Finishing)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to VPS"]
    types: [completed]
    branches: [main]

jobs:
  wip-feeder-probe:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Wait for backend after deploy
        if: github.event_name == 'workflow_run'
        run: sleep 60

      - name: Checkout probe script
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Import Kaj / Handwork / Finishing WIP on prod
        run: |
          set -eu
          cd /root/app
          set -a
          # shellcheck disable=SC1091
          . ./.env
          set +a
          python3 "${GITHUB_WORKSPACE}/backend/scripts/probe_wip_feeder_prod.py"
