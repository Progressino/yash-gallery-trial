name: Fix Inv History + SKU Status (prod)

# Ops fix on the VPS self-hosted runner (localhost → backend).
# Applies authoritative OMS July matrix and SKU Status & Lead Time sheet.

on:
  workflow_dispatch:
    inputs:
      skip_apply:
        description: "Skip matrix re-apply (verify + status only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  fix:
    runs-on: self-hosted
    steps:
      - name: Clear stuck sparse-checkout (self-hosted)
        run: |
          set +e
          for d in "${GITHUB_WORKSPACE}" /root/actions-runner/_work/yash-gallery-trial/yash-gallery-trial; do
            [ -n "$d" ] && [ -d "$d/.git" ] || continue
            git -C "$d" sparse-checkout disable 2>/dev/null
            git -C "$d" config core.sparseCheckout false 2>/dev/null
            rm -f "$d/.git/info/sparse-checkout" 2>/dev/null
          done
          true

      - name: Checkout fixtures + scripts
        uses: actions/checkout@v4
        with:
          path: fix-src
          fetch-depth: 1
          clean: true

      - name: Health before
        run: |
          set -eu
          curl -sf --connect-timeout 5 http://127.0.0.1:8000/api/health | tee /tmp/health_before.json
          echo
          python3 -c "import json;d=json.load(open('/tmp/health_before.json'));print('git',d.get('git_sha'),'warm',d.get('warm_cache'),'sessions',d.get('sessions'))"

      - name: Copy fix assets into backend container
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          SRC="${GITHUB_WORKSPACE}/fix-src"
          ls -lah "$SRC/ops/prod-fix"
          docker cp "$SRC/ops/prod-fix/inventory-matrix-oms-2026-07-source-authoritative.csv" \
            progressino-backend-1:/tmp/inventory-matrix-oms-2026-07-source-authoritative.csv
          docker cp "$SRC/ops/prod-fix/inventory-matrix-oms-2026-07-31-Mismatch.csv" \
            progressino-backend-1:/tmp/inv-mismatch-jul31.csv
          docker cp "$SRC/ops/prod-fix/Sku Status & Lead Time 3.xlsx" \
            progressino-backend-1:/tmp/sku-status-lead-3.xlsx
          docker cp "$SRC/backend/scripts/apply_oms_matrix_authoritative_prod.py" \
            progressino-backend-1:/srv/backend/scripts/apply_oms_matrix_authoritative_prod.py
          docker cp "$SRC/backend/scripts/verify_inv_history_oms_july_prod.py" \
            progressino-backend-1:/srv/backend/scripts/verify_inv_history_oms_july_prod.py
          docker exec progressino-backend-1 ls -lah \
            /tmp/inventory-matrix-oms-2026-07-source-authoritative.csv \
            /tmp/inv-mismatch-jul31.csv \
            /tmp/sku-status-lead-3.xlsx \
            /srv/backend/scripts/apply_oms_matrix_authoritative_prod.py \
            /srv/backend/scripts/verify_inv_history_oms_july_prod.py

      - name: Apply authoritative OMS July matrix
        if: ${{ github.event.inputs.skip_apply != 'true' }}
        run: |
          set -eu
          docker exec -e PYTHONPATH=/srv -w /srv progressino-backend-1 \
            python backend/scripts/apply_oms_matrix_authoritative_prod.py \
            /tmp/inventory-matrix-oms-2026-07-source-authoritative.csv

      - name: Hydrate warm cache + upload SKU Status & Lead Time
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          SRC="${GITHUB_WORKSPACE}/fix-src"
          cd /root/app
          set -a
          # shellcheck disable=SC1091
          . ./.env
          set +a
          export STATUS_XLSX="$SRC/ops/prod-fix/Sku Status & Lead Time 3.xlsx"
          python3 <<'PY'
          import os, sys
          from pathlib import Path
          import requests

          base = "http://127.0.0.1:8000"
          user = os.environ["AUTH_USERNAME"]
          pw = os.environ["AUTH_PASSWORD"]
          src = Path(os.environ["STATUS_XLSX"])
          if not src.is_file():
              sys.exit(f"missing status file: {src}")

          s = requests.Session()
          r = s.post(
              f"{base}/api/auth/login",
              json={"username": user, "password": pw},
              headers={"X-Device-Id": "gha-inv-fix"},
              timeout=60,
          )
          print("login", r.status_code, {k: r.json().get(k) for k in ("ok", "detail", "requires_otp")})
          r.raise_for_status()
          body = r.json()
          if not body.get("ok"):
              sys.exit(f"login failed: {body}")

          h = s.post(f"{base}/api/cache/hydrate-warm", timeout=180)
          print(
              "hydrate",
              h.status_code,
              (
                  h.json().get("message")
                  if h.headers.get("content-type", "").startswith("application/json")
                  else h.text[:200]
              ),
          )
          h.raise_for_status()

          files = {
              "file": (
                  "Sku Status & Lead Time 3.xlsx",
                  src.read_bytes(),
                  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
              )
          }
          up = s.post(f"{base}/api/po/sku-status-lead", files=files, timeout=180)
          print("status_upload", up.status_code, up.text[:500])
          up.raise_for_status()
          data = up.json()
          if not data.get("ok"):
              sys.exit(f"status upload failed: {data}")
          print("status rows", data.get("rows"), data.get("message"))

          g = s.get(f"{base}/api/po/sku-status-lead", timeout=60)
          gj = g.json()
          nrows = len(gj.get("rows") or [])
          print("status_get_rows", nrows, "loaded", gj.get("loaded"))
          if nrows < 100:
              sys.exit(f"status sheet too small after upload: {nrows}")

          health = s.get(f"{base}/api/health", timeout=30).json()
          print(
              "health_after",
              health.get("git_sha"),
              "warm",
              health.get("warm_cache"),
              "sessions",
              health.get("sessions"),
          )
          PY

      - name: Verify Inv History + Eff_Days + status
        run: |
          set -eu
          docker exec -e PYTHONPATH=/srv -w /srv progressino-backend-1 \
            python backend/scripts/verify_inv_history_oms_july_prod.py \
            /tmp/inventory-matrix-oms-2026-07-source-authoritative.csv \
            /tmp/inv-mismatch-jul31.csv
