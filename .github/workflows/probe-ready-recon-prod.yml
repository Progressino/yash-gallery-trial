name: Probe Ready-To vs Stitching recon (prod)

on:
  workflow_dispatch:

jobs:
  ready-recon:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconcile Ready-To vs today's Stitching issues
        run: |
          set -eu
          cd /root/app
          set -a
          # shellcheck disable=SC1091
          . ./.env
          set +a
          export PRODUCTION_DB_PATH="${PRODUCTION_DB_PATH:-/root/app/data/production.db}"
          # Default today; override with RECON_DATE=YYYY-MM-DD when dispatching
          export RECON_DATE="${RECON_DATE:-}"
          python3 "${GITHUB_WORKSPACE}/backend/scripts/probe_ready_recon_prod.py"
