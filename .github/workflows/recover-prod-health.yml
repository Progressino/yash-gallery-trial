name: Recover prod health

# Bring API back: restart if needed, hydrate warm cache, verify nginx + gate.

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /root/app
    steps:
      - name: Detect docker compose
        id: dc
        run: |
          set -eu
          if docker compose version >/dev/null 2>&1; then
            echo "cmd=docker compose" >> "$GITHUB_OUTPUT"
          elif command -v docker-compose >/dev/null 2>&1; then
            echo "cmd=docker-compose" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: docker compose missing" >&2
            exit 1
          fi

      - name: Ensure stack is up
        run: |
          set -eu
          DC="${{ steps.dc.outputs.cmd }}"
          $DC -f docker-compose.prod.yml up -d --remove-orphans
          $DC -f docker-compose.prod.yml ps

      - name: Restart backend if health fails
        run: |
          set +e
          DC="${{ steps.dc.outputs.cmd }}"
          if curl -sf --connect-timeout 5 --max-time 10 http://127.0.0.1:8000/api/health >/dev/null; then
            echo "backend already healthy"
            exit 0
          fi
          echo "backend unhealthy — restarting"
          $DC -f docker-compose.prod.yml restart backend
          for i in $(seq 1 24); do
            if curl -sf --connect-timeout 5 --max-time 10 http://127.0.0.1:8000/api/health; then
              echo ""
              echo "OK after restart attempt $i"
              exit 0
            fi
            echo "waiting $i/24"
            sleep 5
          done
          $DC -f docker-compose.prod.yml logs --tail=100 backend || true
          exit 1

      - name: Hydrate warm cache + verify public paths
        run: |
          set -eu
          set -a
          # shellcheck disable=SC1091
          . ./.env
          set +a
          python3 <<'PY'
          import json, os, sys, time
          import requests

          base = "http://127.0.0.1:8000"
          user = os.environ["AUTH_USERNAME"]
          pw = os.environ["AUTH_PASSWORD"]
          s = requests.Session()
          r = s.post(
              f"{base}/api/auth/login",
              json={"username": user, "password": pw},
              headers={"X-Device-Id": "gha-recover"},
              timeout=60,
          )
          print("login", r.status_code, r.text[:200])
          r.raise_for_status()
          assert r.json().get("ok"), r.text

          for attempt in range(1, 6):
              h = s.post(f"{base}/api/cache/hydrate-warm", timeout=300)
              print("hydrate", attempt, h.status_code, (h.text or "")[:240])
              if h.status_code < 400:
                  break
              time.sleep(5)
          else:
              sys.exit("hydrate failed")

          health = s.get(f"{base}/api/health", timeout=30).json()
          print("health", json.dumps({k: health.get(k) for k in ("git_sha", "warm_cache", "sessions", "status")}))
          if not health.get("warm_cache"):
              # one more hydrate pass
              s.post(f"{base}/api/cache/hydrate-warm", timeout=300)
              health = s.get(f"{base}/api/health", timeout=30).json()
              print("health2", health.get("warm_cache"), health.get("git_sha"))
          if not health.get("warm_cache"):
              sys.exit("warm_cache still false after hydrate")

          for url in (
              "http://127.0.0.1:8000/api/health",
              "http://127.0.0.1/api/health",
              "http://127.0.0.1/",
          ):
              rr = requests.get(url, timeout=15, allow_redirects=True)
              print("probe", url, rr.status_code, len(rr.content))
              rr.raise_for_status()

          # gate smoke
          b = s.get(f"{base}/api/gate/barcode", params={"type": "PO", "number": "PO-RECOVER"}, timeout=30)
          print("barcode", b.status_code)
          b.raise_for_status()
          print("RECOVER_OK", health.get("git_sha"))
          PY
