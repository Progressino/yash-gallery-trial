name: Probe user JO issues (prod)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Probe search / C2P / multi-size validate
        run: |
          set -eu
          curl -sf http://127.0.0.1:8000/api/health | tee /tmp/health.json
          echo
          python3 backend/scripts/probe_user_jo_issues_prod.py
