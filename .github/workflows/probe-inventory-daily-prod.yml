name: Probe Inventory Daily + History export (prod)

# Self-hosted: uses /root/app/.env AUTH against localhost backend.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to VPS"]
    types: [completed]
    branches: [main]

jobs:
  probe:
    # Always probe after a successful Deploy to VPS, or on manual dispatch.
    # (Previously only runs with "inventory" in the commit message were probed,
    # so most deploys showed a 1s "skipped" run — looks broken but never tested.)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Wait for backend after deploy
        if: github.event_name == 'workflow_run'
        # Stagger behind JO/HRM probes so hist_matrix is not contested right after recreate.
        run: sleep 210

      - name: Checkout (for optional fixture paths)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prod inventory Daily + July/August history + production routing
        run: |
          set -eu
          cd /root/app
          set -a
          # shellcheck disable=SC1091
          . ./.env
          set +a
          python3 <<'PY'
          import json
          import os
          import sys
          import time
          import csv
          import io

          import requests

          base = "http://127.0.0.1:8000"
          user = os.environ.get("AUTH_USERNAME") or ""
          pw = os.environ.get("AUTH_PASSWORD") or ""
          if not user or not pw:
              raise SystemExit("AUTH_USERNAME/PASSWORD missing in /root/app/.env")

          s = requests.Session()
          headers = {"X-Device-Id": "gha-inv-aug11-probe"}

          # Health / SHA — wait for warm_cache so matrix/export are not cold-contended.
          health = {}
          wait_deadline = time.time() + 12 * 60
          while time.time() < wait_deadline:
              h = s.get(f"{base}/api/health", timeout=30)
              h.raise_for_status()
              health = h.json() or {}
              print("HEALTH", json.dumps({k: health.get(k) for k in (
                  "status", "git_sha", "label", "warm_cache", "built_at",
                  "upload_memory_lock_held",
              )}))
              if health.get("status") == "ok" and health.get("warm_cache"):
                  break
              time.sleep(10)
          else:
              raise SystemExit(
                  "warm_cache still false after wait — "
                  f"last={json.dumps({k: health.get(k) for k in ('git_sha', 'warm_cache')})}"
              )
          sha = str(health.get("git_sha") or "")
          print("DEPLOY_SHA", sha)

          for attempt in range(1, 6):
              try:
                  r = s.post(
                      f"{base}/api/auth/login",
                      json={"username": user, "password": pw},
                      headers=headers,
                      timeout=60,
                  )
                  print("login", r.status_code, r.text[:200])
                  r.raise_for_status()
                  body = r.json()
                  if body.get("requires_otp"):
                      raise SystemExit("login requires OTP — probe needs password-only user")
                  if not body.get("ok", True) and body.get("detail"):
                      raise SystemExit(f"login failed: {body}")
                  break
              except Exception as e:
                  print("login retry", attempt, e)
                  time.sleep(3)
          else:
              raise SystemExit("login failed")

          # Deploy health can be green while session inventory is still hydrating.
          data = {}
          wait_deadline = time.time() + 12 * 60
          while time.time() < wait_deadline:
              try:
                  h = s.get(f"{base}/api/health", timeout=20)
                  health = h.json() if h.ok else {}
              except Exception as e:
                  print("health_poll_err", e)
                  time.sleep(10)
                  continue
              try:
                  inv = s.get(
                      f"{base}/api/data/inventory",
                      params={"limit": 3, "offset": 0},
                      timeout=45,
                  )
              except requests.exceptions.ReadTimeout:
                  print("inventory_wait timeout — server busy, retrying…")
                  time.sleep(10)
                  continue
              except Exception as e:
                  print("inventory_wait err", e)
                  time.sleep(10)
                  continue
              print(
                  "inventory_wait",
                  "status", inv.status_code,
                  "warm_cache", health.get("warm_cache"),
                  "lock", health.get("upload_memory_lock_held"),
              )
              inv.raise_for_status()
              data = inv.json()
              if data.get("loaded") and int(data.get("total_rows") or 0) > 0:
                  break
              print("INVENTORY_NOT_READY", json.dumps({k: data.get(k) for k in data if k != "rows"})[:400])
              time.sleep(15)
          else:
              raise SystemExit(
                  "inventory still empty after waiting for warm-cache hydrate "
                  "(not a missing Aug 11 RAR unless health.warm_cache stays false)"
              )

          print("inventory_status", 200)
          totals = data.get("totals") or {}
          print(
              "TOTALS",
              {
                  "OMS_Inventory": totals.get("OMS_Inventory"),
                  "Amazon_Inventory": totals.get("Amazon_Inventory"),
                  "Total_Inventory": totals.get("Total_Inventory"),
                  "Marketplace_Total": totals.get("Marketplace_Total"),
                  "total_rows": data.get("total_rows"),
                  "snapshot_date": data.get("snapshot_date"),
                  "snapshot_date_label": data.get("snapshot_date_label"),
              },
          )

          # Full row sum of OMS vs UI totals (pagination)
          oms_sum = 0.0
          total_sum = 0.0
          amz_sum = 0.0
          sku_map = {}
          offset = 0
          total_rows = int(data.get("total_rows") or 0)
          while offset < total_rows:
              page = s.get(
                  f"{base}/api/data/inventory",
                  params={"limit": 5000, "offset": offset},
                  timeout=180,
              )
              page.raise_for_status()
              batch = page.json().get("rows") or []
              if not batch:
                  break
              for row in batch:
                  sku = str(row.get("OMS_SKU") or "").upper()
                  o = float(row.get("OMS_Inventory") or 0)
                  a = float(row.get("Amazon_Inventory") or 0)
                  t = float(row.get("Total_Inventory") or 0)
                  oms_sum += o
                  amz_sum += a
                  total_sum += t
                  if sku in ("AK-228BLACK-3XL", "AK-228BLACK-5XL"):
                      sku_map[sku] = {
                          "OMS_Inventory": o,
                          "Amazon_Inventory": a,
                          "Total_Inventory": t,
                      }
              offset += len(batch)
              if len(batch) < 5000:
                  break

          print(
              "ROW_SUMS",
              {
                  "OMS": int(round(oms_sum)),
                  "Amazon": int(round(amz_sum)),
                  "Total": int(round(total_sum)),
              },
          )
          print("EXAMPLE_SKUS", sku_map)

          ui_oms = int(totals.get("OMS_Inventory") or 0)
          row_oms = int(round(oms_sum))
          if ui_oms != row_oms:
              raise SystemExit(f"UI OMS totals {ui_oms} != row sum {row_oms}")
          print("UI_VS_ROWS_OMS_OK", ui_oms)

          # Server export CSV __TOTALS__
          exp = s.get(f"{base}/api/data/inventory/export.csv", timeout=180)
          print("export_status", exp.status_code, "bytes", len(exp.content))
          exp.raise_for_status()
          rows = list(csv.reader(io.StringIO(exp.text)))
          hdr = rows[0]
          tot_row = rows[1]
          assert tot_row[0] == "__TOTALS__", tot_row[0]
          oms_idx = hdr.index("OMS_Inventory")
          export_oms = int(float(tot_row[oms_idx]))
          print("EXPORT_OMS", export_oms)
          if export_oms != ui_oms:
              raise SystemExit(f"export OMS {export_oms} != UI {ui_oms}")
          print("EXPORT_MATCHES_UI_OK")

          # Inv. History dates (triggers snapshot overlay on first request after deploy).
          date_list = []
          has_jul = has_aug = False
          for attempt in range(1, 6):
              d = s.get(
                  f"{base}/api/po/daily-inventory-history/dates",
                  params={"limit": 120},
                  timeout=180,
              )
              print("hist_dates", attempt, d.status_code, (d.text or "")[:240])
              d.raise_for_status()
              payload = d.json() or {}
              raw_dates = payload.get("dates") or []
              date_list = []
              for x in raw_dates:
                  if isinstance(x, dict):
                      date_list.append(str(x.get("date") or "")[:10])
                  else:
                      date_list.append(str(x)[:10])
              date_list = [x for x in date_list if len(x) == 10]
              has_jul = any(x.startswith("2026-07-") for x in date_list)
              has_aug = any(x.startswith("2026-08-") for x in date_list)
              print(
                  "HIST_DATE_RANGE",
                  {
                      "count": len(date_list),
                      "newest": date_list[:3],
                      "oldest": date_list[-3:],
                      "july": has_jul,
                      "august": has_aug,
                  },
              )
              if has_jul and has_aug:
                  break
              time.sleep(8)
          else:
              raise SystemExit(
                  "Inv. History missing July and/or August 2026 dates: "
                  f"july={has_jul} august={has_aug} dates={date_list[:8]}"
              )
          print("JULY_AUGUST_DATES_OK")

          # UI default is 30 days — probe that first (faster, matches product).
          # Then days=60 for Jul/Aug census coverage. Matrix can cold-start slowly
          # right after deploy (overlay lock + concurrent probes); warm with 7d first.
          def _matrix(days: int, attempts: int = 5, read_timeout: int = 480):
              last_err = None
              for attempt in range(1, attempts + 1):
                  try:
                      resp = s.get(
                          f"{base}/api/po/daily-inventory-history/matrix",
                          params={"days": days, "limit": 5, "channel": "oms"},
                          timeout=read_timeout,
                      )
                      print("hist_matrix", days, attempt, resp.status_code, (resp.text or "")[:200])
                      resp.raise_for_status()
                      return resp.json() or {}
                  except Exception as e:
                      last_err = e
                      print("hist_matrix retry", days, attempt, e)
                      time.sleep(10 * attempt)
              raise SystemExit(f"matrix days={days} failed after {attempts} attempts: {last_err}")

          _matrix(7)  # warm overlay / READ pool before the 30d UI default
          mx30 = _matrix(30)
          mx30_dates = [str(x)[:10] for x in (mx30.get("dates") or [])]
          if len(mx30_dates) < 20:
              raise SystemExit(f"matrix days=30 too few columns: {mx30_dates[:8]}")
          if not any(x.startswith("2026-08-") for x in mx30_dates):
              raise SystemExit(f"matrix days=30 missing August columns: {mx30_dates[:8]}")
          print("MATRIX_30D_OK", {"n_dates": len(mx30_dates), "sample": mx30_dates[:4]})

          mx_body = _matrix(60)
          mx_dates = [str(x)[:10] for x in (mx_body.get("dates") or [])]
          if not any(x.startswith("2026-07-") for x in mx_dates):
              raise SystemExit(f"matrix days=60 missing July columns: {mx_dates[:8]}")
          if not any(x.startswith("2026-08-") for x in mx_dates):
              raise SystemExit(f"matrix days=60 missing August columns: {mx_dates[:8]}")
          print("MATRIX_JULY_AUGUST_OK", {"n_dates": len(mx_dates), "sample": mx_dates[:4]})
          gaps = [str(x)[:10] for x in (mx_body.get("gap_dates") or [])]
          uploaded = [str(x)[:10] for x in (mx_body.get("uploaded_dates") or [])]
          print("MATRIX_UPLOADED_COUNT", len(uploaded), "sample", uploaded[:12])
          print("MATRIX_GAP_COUNT", len(gaps), "sample", gaps[:12])
          jul_aug_gaps = [d for d in gaps if "2026-07-01" <= d <= "2026-08-16"]
          jul_aug_up = [d for d in uploaded if "2026-07-01" <= d <= "2026-08-16"]
          print("JUL_AUG_UPLOADED", len(jul_aug_up), jul_aug_up)
          print("JUL_AUG_GAPS", len(jul_aug_gaps), jul_aug_gaps)
          if len(jul_aug_gaps) >= 40:
              raise SystemExit(
                  "Inv. History still marks 40+ Jul/Aug days as CARRIED "
                  f"({len(jul_aug_gaps)} gaps). Overlay/persist did not restore census days."
              )
          print("MATRIX_JUL_AUG_CENSUS_OK")

          jul = next(x for x in date_list if x.startswith("2026-07-"))
          aug = next(x for x in date_list if x.startswith("2026-08-"))
          for day in (jul, aug):
              byd = s.get(
                  f"{base}/api/po/daily-inventory-history/by-date",
                  params={"date": day, "limit": 20, "channel": "oms"},
                  timeout=180,
              )
              print("hist_by_date", day, byd.status_code)
              byd.raise_for_status()
              body = byd.json() or {}
              n = int(body.get("total") or len(body.get("rows") or []) or 0)
              if n <= 0:
                  raise SystemExit(f"Inv. History {day} has no SKU rows")
              print("HIST_DAY_ROWS_OK", day, n)

          # History async export — overlay can exceed 60s on the first POST after deploy.
          start = None
          for attempt in range(1, 4):
              try:
                  start = s.post(
                      f"{base}/api/po/daily-inventory-history/matrix-export",
                      params={"days": 7, "channel": "oms"},
                      timeout=180,
                  )
                  print("hist_export_start", attempt, start.status_code, start.text[:300])
                  break
              except Exception as e:
                  print("hist_export_start retry", attempt, e)
                  time.sleep(5)
          if start is None:
              raise SystemExit("history export POST failed")
          if start.status_code == 404:
              raise SystemExit("matrix-export endpoint missing — deploy incomplete?")
          start.raise_for_status()
          job_id = (start.json() or {}).get("job_id")
          if not job_id:
              raise SystemExit(f"no job_id: {start.text}")

          deadline = time.time() + 600
          while time.time() < deadline:
              st = s.get(
                  f"{base}/api/po/daily-inventory-history/matrix-export/{job_id}",
                  timeout=60,
              )
              st.raise_for_status()
              body = st.json()
              print("hist_job", body.get("status"), body.get("progress"), body.get("message"))
              if body.get("status") == "error":
                  raise SystemExit(body.get("error") or "history export error")
              if body.get("status") == "ready" or body.get("ready"):
                  dl = s.get(
                      f"{base}/api/po/daily-inventory-history/matrix-export/{job_id}/download",
                      timeout=120,
                  )
                  print("hist_download", dl.status_code, "bytes", len(dl.content))
                  dl.raise_for_status()
                  if len(dl.content) < 50:
                      raise SystemExit("history CSV too small")
                  print("HISTORY_ASYNC_EXPORT_OK")
                  break
              time.sleep(3)
          else:
              raise SystemExit("history export job timeout")

          # Production routing: do not GET /orders (computes next_process for every JO and times out).
          probe_skus = list(sku_map.keys()) or ["AK-228BLACK-3XL"]
          try:
              items = s.get(
                  f"{base}/api/items",
                  params={"parent_only": True},
                  timeout=60,
              )
              print("items_parent", items.status_code)
              if items.ok:
                  raw_items = items.json()
                  parents = raw_items if isinstance(raw_items, list) else []
                  for p in parents[:25]:
                      pid = p.get("id")
                      if not pid:
                          continue
                      det = s.get(f"{base}/api/items/{pid}", timeout=30)
                      if not det.ok:
                          continue
                      body = det.json() or {}
                      names = [str(r.get("name") or "") for r in (body.get("routing") or [])]
                      if any("kaj" in n.lower() for n in names):
                          variants = body.get("variants") or []
                          code = (
                              (variants[0].get("item_code") if variants else None)
                              or body.get("item_code")
                              or p.get("item_code")
                          )
                          if code:
                              probe_skus.insert(0, str(code))
                          break
          except Exception as e:
              print("items_lookup_skip", e)

          routing_checked = 0
          kaj_checked = 0
          seen = set()
          for sku in probe_skus:
              sku = str(sku or "").strip()
              if not sku or sku in seen:
                  continue
              seen.add(sku)
              rt = s.get(
                  f"{base}/api/production/item-routing/{sku}",
                  params={"process": "Stitching"},
                  timeout=60,
              )
              print("item_routing", sku, rt.status_code, (rt.text or "")[:220])
              rt.raise_for_status()
              info = rt.json() or {}
              path = info.get("item_routing") or info.get("routing") or []
              names = [str(p) for p in path] if path and not isinstance(path[0], dict) else [
                  str((p or {}).get("name") or "") for p in path
              ]
              nxt = str(info.get("next_process") or "")
              mode = str(info.get("production_mode") or "inhouse").lower().replace("-", "")
              print("ROUTING", sku, "mode", mode, "path", names, "next_after_stitch", nxt)
              routing_checked += 1
              joined = " > ".join(names).lower()
              if "kaj" in joined:
                  kaj_checked += 1
                  # Only fail when Kaj is sequenced *after* Stitching but next skips to Finishing.
                  # Styles like Cutting → Kaj → Stitching → Finishing correctly next to Finishing.
                  names_l = [str(n).lower() for n in names]
                  try:
                      stitch_i = next(i for i, n in enumerate(names_l) if "stitch" in n)
                      kaj_i = next(i for i, n in enumerate(names_l) if "kaj" in n)
                  except StopIteration:
                      stitch_i = kaj_i = -1
                  if (
                      mode == "inhouse"
                      and stitch_i >= 0
                      and kaj_i > stitch_i
                      and nxt.lower() in ("finishing", "finish")
                  ):
                      raise SystemExit(
                          f"{sku} in-house Stitching next_process={nxt} but Style routing has Kaj after Stitching: {names}"
                      )
          ready = s.get(f"{base}/api/production/ready-to-process/Cutting", timeout=120)
          print("ready_to_cutting", ready.status_code, (ready.text or "")[:180])
          ready.raise_for_status()
          if routing_checked <= 0:
              raise SystemExit("item-routing API returned no SKUs — production routing not tested")
          print(
              "PRODUCTION_ROUTING_OK",
              {"routing_checked": routing_checked, "kaj_styles": kaj_checked, "skus": list(seen)},
          )

          print("ALL_PROBES_OK")
          PY
